name: Build Go WebServer

on:
  push:
    branches:
      - 'feature/go-**'
      - 'hotfix/go-**'
    paths: 
      - 'go/**'
      - '.github/workflows/go-webserver.yml'
  pull_request:
    branches: [ main]
    paths:
      - 'go/**'
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./go
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Git Short SHA
      id: get_short_sha
      run: echo "GITSHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: go test -v ./...

    - name: Run tests with coverage
      run: go test -coverprofile=coverage.out ./...

    - name: Display coverage
      run: go tool cover -func=coverage.out
  

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ./go

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
  
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        platforms: linux/amd64,linux/arm64
        push: false
        tags: repo-ws-go:latest
