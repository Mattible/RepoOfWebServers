name: Build Python WebServer

on:
  push:
    branches:
      - 'feature/python-**'
      - 'hotfix/python-**'
    paths: 
      - 'python/**'
      - '.github/workflows/python-webserver.yml'
  pull_request:
    branches: [main]
    paths:
      - 'python/**'
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pytest coverage flake8 black

    - name: Format Check
      run: black . --line-length=79 --check

    - name: Linting
      run: flake8 . --statistics --count --show-source

    - name: Run tests with coverage
      run: |
        coverage run -m pytest .
        coverage report
        coverage xml

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ./python

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        platforms: linux/amd64,linux/arm64
        push: false
        tags: repo-ws-python:latest
        context: ./python
