[package]
name = "rust-webserver"
version = "0.1.0"
edition = "2024"
authors = ["mattible@gmail.com"]
description = "A simple Rust TCP-based HTTP web server with graceful shutdown"
license = "MIT"

[lib]
name = "rust_webserver"
path = "src/lib.rs"

[[bin]]
name = "main"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ctrlc = "3.4"
async-std = { version = "1.12", features = ["attributes"] }

[dev-dependencies]
serial_test = "3.0"
